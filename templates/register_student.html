<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Student</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="header">
  <img src="{{ url_for('static', filename='psgtech_logo.png') }}" class="logo-img">
  <span class="website-title neon">PSG TECH Event Management</span>
</header>
<div class="container fadeInUp" style="text-align:center;">
  <h2 class="section-title neon">Student Registration</h2>
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <input type="text" name="name" placeholder="Name" required>
    <input type="text" name="rollno" placeholder="Roll No." required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="phone" placeholder="Phone" required>
    <input type="text" name="department" placeholder="Department" required>
    <input type="text" name="branch" placeholder="Branch" required>
    <input type="text" name="batch" placeholder="Batch" required>
    <input type="date" name="dob" placeholder="Date of Birth" required>
    <button type="submit" class="purple-btn">Register</button>
  </form>
</div>
</body>
</html>
