<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Students</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="header">
  <img src="{{ url_for('static', filename='psgtech_logo.png') }}" class="logo-img">
  <span class="website-title neon">PSG TECH Event Management</span>
</header>
<div class="sidebar">
  <ul>
    <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    <li><a href="{{ url_for('access_students') }}">Access Students</a></li>
    <li><a href="{{ url_for('admin_events') }}">Events</a></li>
    <li><a href="{{ url_for('inbox') }}">Inbox</a></li>
    <li><a href="{{ url_for('settings') }}">Settings</a></li>
    <li><a href="{{ url_for('logout') }}">Logout</a></li>
  </ul>
</div>
<div class="main-content">
  <h2 class="section-title">Students List</h2>
  {% for stu in students %}
    <a href="{{ url_for('student_detail', student_id=stu.id) }}">
      <div class="record-card">
        <strong>Name:</strong> {{ stu.name }} |
        <strong>Roll No:</strong> {{ stu.rollno }} |
        <strong>Branch:</strong> {{ stu.branch }} |
        <strong>Batch:</strong> {{ stu.batch }}
      </div>
    </a>
  {% endfor %}
</div>
</body>
</html>
