<header class="header">
  <img src="{{ url_for('static', filename='psgtech_logo.png') }}" class="logo-img">
  <span class="website-title neon">PSG TECH Event Management</span>
</header>
<div class="container fadeInUp" style="text-align:center;">
  <h2 class="section-title neon">Login</h2>
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="purple-btn">Login</button>
  </form>
  <br>
  <a href="{{ url_for('register_admin') }}" class="purple-btn" style="width:60%;">New Admin? Register</a>
  <br><br>
  <a href="{{ url_for('register_student') }}" class="purple-btn" style="width:60%;">New Student? Register</a>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="message error">{% for message in messages %}{{ message }}<br>{% endfor %}</div>
    {% endif %}
  {% endwith %}
</div>
